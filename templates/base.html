<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Sábatoxd{% endblock %}</title>

<link rel="icon" href="{{ url_for('static', filename='icon.png') }}?v=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <a href="{{ url_for('index') }}" class="brand">
        <span class="brand-text">Sábatoxd</span>
    </a>
    <nav class="nav-links">
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Inicio</a>
        <a href="{{ url_for('lists_view') }}" class="{{ 'active' if request.endpoint in ['lists_view','list_detail','new_list','edit_list'] else '' }}">Libretas</a>
    </nav>
    <a href="{{ url_for('new_book') }}" class="btn btn-primary btn-add">+ Agregar libro</a>
</header>

<div class="flash-wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <span>Sábatoxd</span>
</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
