name: Compilar ejecutables

# Se dispara al crear un tag de versión (ej: v1.0.0) y también se puede
# lanzar a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Sabatoxd.exe
            asset_name: Sabatoxd-Windows.exe
          - os: macos-latest
            artifact_name: Sabatoxd
            asset_name: Sabatoxd-Mac
          - os: ubuntu-latest
            artifact_name: Sabatoxd
            asset_name: Sabatoxd-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-build.txt

      - name: Compilar con PyInstaller
        run: pyinstaller build.spec --noconfirm

      - name: Renombrar el ejecutable
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.artifact_name }}" "out/${{ matrix.asset_name }}"

      - name: Subir como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

      - name: Adjuntar al Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}
